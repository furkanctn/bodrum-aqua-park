# =============================================================================
# POS profili — yerel veya sunucu PostgreSQL
# Çalıştırma: java -jar ... --spring.profiles.active=pos
# veya: SPRING_PROFILES_ACTIVE=pos ./mvnw spring-boot:run
# =============================================================================
#
# Önkoşul: Veritabanı oluşturulmuş olmalı:
#   createdb bodrum_aqua_park
#   veya: psql -d postgres -c "CREATE DATABASE bodrum_aqua_park;"
#
# Kimlik bilgisi (şifreyi repoya yazmayın):
#   export SPRING_DATASOURCE_USERNAME=postgres
#   export SPRING_DATASOURCE_PASSWORD=gizli
#   export SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/bodrum_aqua_park
#
# Varsayılan kullanıcı: postgres (kurulumda oluşturduğunuz süper kullanıcı).
# macOS Homebrew’de sadece OS kullanıcınız varsa: export SPRING_DATASOURCE_USERNAME=$(whoami)
# =============================================================================

# PostgreSQL sunucu adresi: 192.168.0.15:5432
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.0.15:5432/bodrum_aqua_park}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Offline mod: DB kapalıysa da uygulama başlar
# API çağrılarında DB yoksa 503 döner (db-guard filtresi)
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=${APP_HIBERNATE_METADATA_ACCESS:false}
spring.jpa.hibernate.ddl-auto=${APP_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Çoklu kasa: her PC kendi JAR + Edge cache; güncelleme sonrası eski pos.html/js kalmasın
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Türkiye saati (log / Instant / JSON tarihleri için tutarlılık)
spring.jackson.time-zone=Europe/Istanbul
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Istanbul

# Hikari: DB kapalıysa da uygulama başlar (offline mod)
# -1 = bağlantı beklemeden başla, API'de 503 döner
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=${APP_HIKARI_INIT_TIMEOUT:-1}
spring.datasource.hikari.connection-timeout=${APP_HIKARI_CONNECTION_TIMEOUT:5000}
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=60000

# DB bağlantı kontrolü: Her API isteğinde DB erişilebilirliği kontrol edilir
# Bağlantı koparsa 503 Service Unavailable döner
app.startup.db-guard.enabled=${APP_DB_GUARD_ENABLED:true}
app.startup.db-guard.check-ttl-ms=${APP_DB_GUARD_TTL_MS:2000}

# DB kapalı/auth-fail durumunda Hibernate iç logger'larının tekrarlı ERROR mesajlarını sustur
# (BootstrapResilience zaten tek bir uyarı logu basıyor; çift kayıt log dosyasını şişiriyordu).
# Açmak için: APP_HIBERNATE_SQL_LOG_LEVEL=ERROR
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=${APP_HIBERNATE_SQL_LOG_LEVEL:OFF}
logging.level.com.zaxxer.hikari.pool.HikariPool=${APP_HIKARI_LOG_LEVEL:WARN}

# Turnike: karttan düşülen giriş ücreti (TL)
app.entry.fee=50.00

# Fiş yazıcı zorunluluğu: true ise yazıcı bağlı değilken satış yapılamaz
# false = yazıcı olmadan da satış yapılabilir
app.printer.required-for-sale=${APP_PRINTER_REQUIRED:false}

# JWT, server.port, fiş yazıcı, app.card.* → application.properties (burada tekrarlamaya gerek yok)
# Üretim: APP_JWT_SECRET ortam değişkeni zorunlu; ana dosyadaki varsayılan secret kullanılmamalı
#
# Sürüm arşivi (Smart Launcher + canlı güncelleme): İstanbul sunucuda C:\Aquapark_Update\latest.txt
# BodrumAquaPark.bat ana JAR ile aynı klasörde *-launcher.jar varken AQUAPARK_LAUNCHER_JAR ortamını ayarlar.
# İsterseniz elle ortam (paylaşım veya farklı yol):
#   AQUAPARK_UPDATE_ROOT=C:/Aquapark_Update
#   AQUAPARK_LOCAL_DIR=C:/Aquapark
#   AQUAPARK_LAUNCHER_JAR=C:/Aquapark/bodrum-aqua-park-api-1.2.0.1-launcher.jar
# Zorunlu güncelleme: app_settings.setting_key = aquapark.mandatory_update_version , değer = latest.txt ile aynı
