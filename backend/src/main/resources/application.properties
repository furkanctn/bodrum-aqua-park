spring.application.name=bodrum-aqua-park-api

# Merkezi sürüm arşivi: C:/Aquapark_Update/latest.txt (varsayılan; geçersiz kılmak: aquapark.update.network-root veya AQUAPARK_UPDATE_ROOT).
aquapark.update.enabled=true
aquapark.update.local-install-dir=${AQUAPARK_LOCAL_DIR:}
# Windows USB: BodrumAquaPark.bat AQUAPARK_LAUNCHER_JAR atar (ana JAR ile aynı klasörde *-launcher.jar).
aquapark.update.launcher-jar-path=${AQUAPARK_LAUNCHER_JAR:}
aquapark.update.check-interval-ms=900000
aquapark.update.child-jvm-extra-args=--desktop
# Günlük: göreli yol (IDE / doğru cwd). Windows USB: BodrumAquaPark.bat LOG_FILE=mutlak yol atar (start ile cwd sorunu).
logging.file.name=bodrum-sunucu.log
# Varsayılan: pos (PostgreSQL). H2 dosya için: SPRING_PROFILES_ACTIVE=dev veya IDE'de "dev — H2" launch.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:pos}

server.port=8081

# JWT (üretimde APP_JWT_SECRET ortam değişkeni ile güçlü ve en az 32 karakter)
app.jwt.secret=${APP_JWT_SECRET:bodrum-aqua-park-dev-secret-change-in-prod-32b-min}
app.jwt.expiration-hours=12

# Fiş yazıcı (Sewoo vb. ESC/POS, USB → sanal COM). Windows: Aygıt Yöneticisi → COM numarası.
# Varsayılan boş: bir kez yönetim → Fiş yazıcıda test + kayıt (veritabanı), veya APP_PRINTER_PORT=COM3.
app.printer.port=${APP_PRINTER_PORT:}
app.printer.baud-rate=${APP_PRINTER_BAUD:9600}
# Windows: Yazıcı kuyruk adı (Aygıtlar ve Yazıcılar'daki ad) — doluysa COM yerine javax.print ile ham gönderim.
# Örn: APP_PRINTER_WINDOWS_QUEUE=SEWOO SLK-TS400  (her kasa PC'de ayrı ortam değişkeni önerilir.)
app.printer.windows-queue-name=${APP_PRINTER_WINDOWS_QUEUE:}

# Beko X30 TR — TokenX Connect (Wired) / BekoOkcServisi (varsayılan http://127.0.0.1:9001)
# Swagger: http://127.0.0.1:9001/swagger/ui — SendBasket yolunu app.beko-pos.send-basket-path ile eşleştirin
app.beko-pos.enabled=${APP_BEKO_POS_ENABLED:true}
app.beko-pos.base-url=${APP_BEKO_POS_BASE_URL:http://127.0.0.1:9001}
app.beko-pos.send-basket-path=${APP_BEKO_POS_SEND_BASKET_PATH:/api/Basket/SendBasket}
app.beko-pos.status-path=${APP_BEKO_POS_STATUS_PATH:/api/Device/GetDeviceInfo}
app.beko-pos.section-no=${APP_BEKO_POS_SECTION_NO:1}
app.beko-pos.tax-percent=${APP_BEKO_POS_TAX_PERCENT:1000}

# Kart tanımlamada initialBalance 0 ise bu tutar kullanılır (demo / geçici varsayılan)
app.card.default-initial-balance=5000

# Demo POS: bu UID başlangıçta yoksa oluşturulur, varsa bakiye aşağıdaki tutara çekilir. Boş = kapalı.
app.card.demo-uid=123
app.card.demo-balance=5000

# Mifare kart UID — kanonik depolama: 8 veya 14 karakter büyük hex (4/7 bayt).
app.card.mifare-strict-validation=true
# Geçiş dönemi: eski proximity ondalık UID eşleşmesi (tam geçişten sonra false yapın).
app.card.legacy-decimal-lookup=true
# Okuyucu bayt-ters hex gönderiyorsa true bırakın.
app.card.reverse-byte-order-lookup=true

# true: her açılışta sicil 0000 parolasını "0000" yapar ve hesabı aktif eder (unutulan şifre / bozuk hash kurtarma)
app.bootstrap.repair-admin0000=${APP_REPAIR_ADMIN0000:false}

# RFID / turnike cihazı — ikisi de doluysa uygulama açılışında bir kez TurnstileDevice kaydı oluşturulur (üretimde boş bırakın).
app.access.bootstrap.device-id=${APP_ACCESS_BOOTSTRAP_DEVICE_ID:}
app.access.bootstrap.device-token=${APP_ACCESS_BOOTSTRAP_DEVICE_TOKEN:}

# Turnike HTTP: CORS (virgülle ayrı köken), IP başına dakikalık istek sınırı (0=kapalı), çevrimiçi eşiği (saniye)
app.access.http.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.access.http.rate-limit-requests-per-minute=${APP_ACCESS_RATE_LIMIT_PER_MINUTE:120}
app.access.http.device-online-threshold-seconds=${APP_ACCESS_DEVICE_ONLINE_THRESHOLD_SEC:120}

# PostgreSQL (sunucu / prod): --spring.profiles.active=prod + ortam değişkenleri
# POS bank + yerel PostgreSQL: --spring.profiles.active=pos (ayrıntı: application-pos.properties)
