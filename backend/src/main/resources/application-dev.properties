# Yerel geliştirmede 0000 şifresi bozulduysa otomatik onar (prod’da kullanmayın)
app.bootstrap.repair-admin0000=true

# NOT: h2:mem — uygulama kapanınca tüm veri silinir. Yerel geliştirmede kalıcılık için dosya tabanlı H2.
# Kalıcı veri için PostgreSQL: --spring.profiles.active=pos (application-pos.properties)
spring.datasource.url=jdbc:h2:file:./data/bodrum-dev;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Turnike: karttan düşülen giriş ücreti (TL)
app.entry.fee=50.00

# Geliştirmede merkezi C:/Aquapark_Update taraması kapalı (isterseniz kaldırın)
aquapark.update.enabled=false

# Geliştirme: statik dosya önbelleği kapalı (Chrome eski CSS/JS tutmasın)
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# DevTools: dosya değişince uygulama yeniden başlar, tarayıcı LiveReload ile yenilenir
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/static
